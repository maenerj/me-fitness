<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Me Fitness">
  <title>Me Fitness</title>
  <style>
    :root {
      --bg: #0b0d11;
      --card: #151921;
      --card-border: #262c3a;
      --primary: #f59e0b;
      --primary-dim: rgba(245, 158, 11, 0.15);
      --success: #10b981;
      --danger: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 110px) 14px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand h1 { font-size: 1.35rem; margin: 0; color: var(--primary); font-weight: 800; }
    .brand span { font-size: 0.78rem; color: var(--muted); }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    /* Scrollbare Tabs für bis zu 7 Splits */
    .tabs-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .tabs {
      display: flex;
      background: #11141b;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      gap: 4px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .add-split-btn {
      background: #11141b;
      border: 1px dashed var(--card-border);
      color: var(--primary);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .progress-bar-wrap {
      background: #151921;
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, var(--primary), var(--success));
      height: 100%;
      width: 0%;
      transition: width 0.25s ease;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .ex-title { font-weight: 700; font-size: 1.02rem; }
    .badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge-target {
      font-size: 0.75rem;
      background: var(--primary-dim);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }
    .badge-levelup {
      font-size: 0.72rem;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: 700;
    }
    .edit-ex-btn {
      background: #1f2532;
      border: 1px solid var(--card-border);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .setup-toggle {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      padding: 0;
      margin-bottom: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-align: left;
    }
    .note-box {
      width: 100%;
      background: #0e1117;
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.82rem;
      margin-bottom: 10px;
      display: none;
    }
    .note-box.open { display: block; }
    .set-row {
      display: grid;
      grid-template-columns: 26px 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    .set-num { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
    .stepper {
      display: flex;
      align-items: center;
      background: #0e1117;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .step-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      width: 28px;
      height: 36px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .stepper input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      text-align: center;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 0;
    }
    .unit-label { font-size: 0.68rem; color: var(--muted); padding-right: 6px; }
    .done-btn {
      width: 40px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #0e1117;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .done-btn.checked {
      background: var(--success);
      border-color: var(--success);
      color: #052e16;
    }
    .btn-add-ex {
      width: 100%;
      background: #151921;
      border: 1px dashed var(--card-border);
      color: var(--muted);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-finish {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      margin-top: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .split-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .split-meta-title { font-weight: 700; font-size: 0.88rem; color: var(--muted); }
    .del-split-btn {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--danger);
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Log-Übersicht */
    .log-item {
      background: #0e1117;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .log-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .log-title { font-weight: 800; font-size: 1rem; color: var(--primary); }
    .log-date { font-size: 0.76rem; color: var(--muted); }
    .log-stats { font-size: 0.8rem; margin-bottom: 10px; color: var(--muted); }
    .log-mini-table {
      background: #151921;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .log-mini-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .log-mini-row:last-child { border-bottom: none; }
    .log-mini-name { color: var(--text); font-weight: 600; }
    .log-mini-val { color: var(--primary); font-variant-numeric: tabular-nums; font-weight: 700; }
    .log-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm {
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: #1e2430;
      color: var(--text);
    }
    .btn-sm.primary { background: var(--primary); color: #000; border-color: var(--primary); }
    .btn-sm.danger { background: rgba(239, 68, 68, 0.18); color: var(--danger); border-color: var(--danger); }

    /* Floating Timer */
    .timer-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 12px);
      left: 12px;
      right: 12px;
      background: rgba(21, 25, 33, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 100;
    }
    .timer-display {
      font-size: 1.35rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
    }
    .timer-sub { font-size: 0.7rem; color: var(--muted); display: block; }
    .timer-controls { display: flex; gap: 6px; }
    .t-btn {
      background: #232936;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .t-btn.primary { background: var(--primary); color: #000; border-color: var(--primary); }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 14px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-header h3 { margin: 0; font-size: 1.1rem; color: var(--primary); }
    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
    }
    .chip-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip {
      background: #0e1117;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 5px 9px;
      border-radius: 99px;
      font-size: 0.74rem;
      cursor: pointer;
    }
    .form-row { margin-bottom: 10px; }
    .form-row label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .form-input {
      width: 100%;
      background: #0e1117;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Me Fitness</h1>
      <span id="date-str">Gym80 Trainingsplan</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="saveCurrentWorkoutToLog()" title="Training speichern">💾 Log</button>
      <button class="icon-btn" onclick="copyForChat()" title="Für Chat kopieren">📋 Chat</button>
      <button class="icon-btn" onclick="resetChecks()" title="Sätze auf 12 Wdh. zurücksetzen">🔄 Reset</button>
    </div>
  </header>

  <div class="tabs-container">
    <div class="tabs" id="split-tabs-bar"></div>
    <button class="add-split-btn" onclick="addNewSplit()" title="Neuen Split hinzufügen (bis zu 7)">➕</button>
  </div>

  <div class="progress-bar-wrap" id="p-wrap">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div id="workout-container"></div>

  <!-- Floating Timer -->
  <div class="timer-bar" id="t-bar">
    <div>
      <span class="timer-sub" id="timer-status">Pausentimer bereit</span>
      <span class="timer-display" id="timer-readout">01:30</span>
    </div>
    <div class="timer-controls">
      <button class="t-btn" onclick="adjustTimer(-15)">-15s</button>
      <button class="t-btn" onclick="adjustTimer(15)">+15s</button>
      <button class="t-btn primary" id="timer-toggle" onclick="toggleTimer()">Start</button>
      <button class="t-btn" onclick="resetTimer(90)">↺</button>
    </div>
  </div>

  <!-- Modal 1: Log-Eintrag nachträglich bearbeiten -->
  <div class="modal-overlay" id="edit-log-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Log-Eintrag bearbeiten</h3>
        <button class="close-modal-btn" onclick="closeEditLogModal()">×</button>
      </div>
      <div class="form-row">
        <label>Datum & Uhrzeit:</label>
        <input type="text" class="form-input" id="edit-log-date">
      </div>
      <div class="form-row">
        <label>Trainings-Notiz / Tagesform:</label>
        <input type="text" class="form-input" id="edit-log-note" placeholder="z.B. Gute Kraft, Schulter leicht gemerkt...">
      </div>
      <div id="edit-log-exercises"></div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn-sm primary" style="flex:1; padding:10px;" onclick="saveEditedLog()">Speichern</button>
        <button class="btn-sm" style="padding:10px;" onclick="closeEditLogModal()">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Gerät anpassen / hinzufügen -->
  <div class="modal-overlay" id="edit-ex-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="ex-modal-title">Gerät anpassen</h3>
        <button class="close-modal-btn" onclick="closeExModal()">×</button>
      </div>
      <label style="font-size:0.74rem; color:var(--muted); display:block; margin-bottom:6px;">Gym80 Schnellauswahl:</label>
      <div class="chip-wrap" id="preset-chips"></div>
      <div class="form-row">
        <label>Name der Übung / Maschine:</label>
        <input type="text" class="form-input" id="ex-name-input">
      </div>
      <div class="form-grid">
        <div class="form-row">
          <label>Min. Wdh.:</label>
          <input type="number" class="form-input" id="ex-min-input" value="8">
        </div>
        <div class="form-row">
          <label>Max. Wdh. (Ziel):</label>
          <input type="number" class="form-input" id="ex-max-input" value="12">
        </div>
        <div class="form-row">
          <label>Startgewicht (kg):</label>
          <input type="number" step="0.5" class="form-input" id="ex-weight-input" value="30">
        </div>
        <div class="form-row">
          <label>Steigerungsschritt (kg):</label>
          <input type="number" step="0.5" class="form-input" id="ex-step-input" value="2.5">
        </div>
        <div class="form-row">
          <label>Pause (Sekunden):</label>
          <input type="number" step="15" class="form-input" id="ex-rest-input" value="90">
        </div>
        <div class="form-row">
          <label>Sätze (1–5):</label>
          <input type="number" min="1" max="5" class="form-input" id="ex-sets-input" value="3">
        </div>
      </div>
      <div class="form-row">
        <label>Gym80 Setup-Hinweis (Sitzhöhe, Polster):</label>
        <input type="text" class="form-input" id="ex-hint-input">
      </div>
      <div style="display:flex; gap:8px; margin-top:12px;" id="ex-move-controls">
        <button class="btn-sm" onclick="moveExercise(-1)">⬆️ Hoch</button>
        <button class="btn-sm" onclick="moveExercise(1)">⬇️ Runter</button>
        <button class="btn-sm danger" style="margin-left:auto;" onclick="deleteExercise()">🗑️ Löschen</button>
      </div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn-sm primary" style="flex:1; padding:10px;" onclick="saveExerciseModal()">Übernehmen</button>
        <button class="btn-sm" style="padding:10px;" onclick="closeExModal()">Abbrechen</button>
      </div>
    </div>
  </div>

  <script>
    const alphabet = ["A", "B", "C", "D", "E", "F", "G"];

    const defaultPlan = {
      A: [
        { id: "a1", name: "Beinpresse 45°", min: 8, max: 12, weight: 130, step: 5, rest: 120, setsCount: 3, hint: "Füße mittig, schulterbreit" },
        { id: "a2", name: "Beinstrecker", min: 10, max: 12, weight: 65, step: 2.5, rest: 90, setsCount: 3, hint: "Oben 1 Sekunde halten" },
        { id: "a3", name: "Brustpresse flach", min: 8, max: 12, weight: 27.5, step: 2.5, rest: 90, setsCount: 3, hint: "Schulterblätter fixiert" },
        { id: "a4", name: "Rudern brustgestützt", min: 8, max: 12, weight: 50, step: 2.5, rest: 90, setsCount: 3, hint: "Ellbogen eng am Körper" },
        { id: "a5", name: "Latzug breit", min: 10, max: 12, weight: 55, step: 2.5, rest: 90, setsCount: 3, hint: "Zur oberen Brust ziehen" },
        { id: "a6", name: "Seithebemaschine", min: 10, max: 12, weight: 20, step: 2.5, rest: 60, setsCount: 3, hint: "Seitliche Schulter" },
        { id: "a7", name: "Trizeps-Maschine / Kabel", min: 10, max: 12, weight: 25, step: 2.5, rest: 60, setsCount: 3, hint: "Ellbogen fest fixiert" },
        { id: "a8", name: "Bauchmaschine", min: 10, max: 12, weight: 90, step: 2.5, rest: 60, setsCount: 3, hint: "Rollende Bewegung aus Rippen" }
      ],
      B: [
        { id: "b1", name: "Beinpresse (Füße hoch)", min: 10, max: 12, weight: 125, step: 5, rest: 120, setsCount: 3, hint: "Füße weit oben für Gesäß/Beinbeuger" },
        { id: "b2", name: "Beinbeuger sitzend", min: 10, max: 12, weight: 65, step: 2.5, rest: 90, setsCount: 3, hint: "Fersen aktiv anziehen" },
        { id: "b3", name: "Schräg-Brustpresse", min: 8, max: 12, weight: 25, step: 2.5, rest: 90, setsCount: 3, hint: "Obere Brust" },
        { id: "b4", name: "Latzug eng (Parallel)", min: 8, max: 12, weight: 60, step: 2.5, rest: 90, setsCount: 3, hint: "Enger Griff, Lat-Fokus" },
        { id: "b5", name: "Butterfly", min: 10, max: 12, weight: 25, step: 2.5, rest: 60, setsCount: 3, hint: "Arme leicht gebeugt" },
        { id: "b6", name: "Reverse Butterfly", min: 10, max: 12, weight: 25, step: 2.5, rest: 60, setsCount: 3, hint: "Hintere Schulter" },
        { id: "b7", name: "Bizepscurls", min: 10, max: 12, weight: 22.5, step: 2.5, rest: 60, setsCount: 3, hint: "Ohne Schwung" },
        { id: "b8", name: "Rumpfstrecker / Bauch", min: 10, max: 12, weight: 90, step: 2.5, rest: 60, setsCount: 3, hint: "Rückenstrecker oder Crunch" }
      ]
    };

    const gym80Presets = [
      { name: "Trizeps-Maschine", min: 10, max: 12, weight: 25, step: 2.5, rest: 60, hint: "Arme auf Polster fixiert" },
      { name: "Dip-Maschine sitzend", min: 8, max: 12, weight: 40, step: 5, rest: 90, hint: "Oberkörper aufrecht" },
      { name: "Rumpfstrecker (Back Ext.)", min: 10, max: 12, weight: 45, step: 5, rest: 60, hint: "Polster auf Hüfthöhe" },
      { name: "Schulterpresse", min: 8, max: 12, weight: 25, step: 2.5, rest: 90, hint: "Griffe auf Kinn-Höhe" },
      { name: "Adduktion", min: 10, max: 12, weight: 90, step: 2.5, rest: 60, hint: "Innenschenkel" },
      { name: "Abduktion", min: 10, max: 12, weight: 90, step: 2.5, rest: 60, hint: "Außenschenkel" },
      { name: "Wadenheben", min: 10, max: 12, weight: 60, step: 5, rest: 60, hint: "Volle Dehnung unten" },
      { name: "Duale Brustpresse", min: 8, max: 12, weight: 30, step: 2.5, rest: 90, hint: "Konvergierende Bewegung" }
    ];

    let plan = JSON.parse(localStorage.getItem('me_fitness_plan') || 'null') || defaultPlan;
    let activeTab = localStorage.getItem('gym80_active_tab') || 'A';
    let state = JSON.parse(localStorage.getItem('gym80_pro_state') || '{}');
    let logs = JSON.parse(localStorage.getItem('me_fitness_logs') || '[]');

    let currentEditingLogIndex = null;
    let editingExIndex = null;

    function savePlan() { localStorage.setItem('me_fitness_plan', JSON.stringify(plan)); }
    function saveState() { localStorage.setItem('gym80_pro_state', JSON.stringify(state)); updateProgress(); }
    function saveLogs() { localStorage.setItem('me_fitness_logs', JSON.stringify(logs)); }

    function getSplitKeys() {
      return Object.keys(plan).filter(k => alphabet.includes(k)).sort();
    }

    function addNewSplit() {
      const currentKeys = getSplitKeys();
      if (currentKeys.length >= 7) {
        alert('Maximal 7 Splits (A bis G) möglich.');
        return;
      }
      const nextKey = alphabet[currentKeys.length];
      if (confirm(`Neuen Split "Einheit ${nextKey}" hinzufügen?`)) {
        // Basis-Setup für den neuen Split (Vorbelegt mit 12 Wdh.)
        plan[nextKey] = [
          { id: `${nextKey.toLowerCase()}1`, name: "Beinpresse 45°", min: 8, max: 12, weight: 120, step: 5, rest: 120, setsCount: 3, hint: "Saubere Tiefe" },
          { id: `${nextKey.toLowerCase()}2`, name: "Brustpresse", min: 8, max: 12, weight: 25, step: 2.5, rest: 90, setsCount: 3, hint: "Volle Streckung" },
          { id: `${nextKey.toLowerCase()}3`, name: "Rudern brustgestützt", min: 8, max: 12, weight: 45, step: 2.5, rest: 90, setsCount: 3, hint: "Ellbogen eng" },
          { id: `${nextKey.toLowerCase()}4`, name: "Seithebemaschine", min: 10, max: 12, weight: 20, step: 2.5, rest: 60, setsCount: 3, hint: "Seitliche Schulter" }
        ];
        savePlan();
        switchTab(nextKey);
      }
    }

    function removeCurrentSplit() {
      const currentKeys = getSplitKeys();
      if (currentKeys.length <= 2) {
        alert('Mindestens 2 Splits müssen erhalten bleiben.');
        return;
      }
      if (confirm(`Möchtest du Einheit ${activeTab} wirklich komplett löschen?`)) {
        delete plan[activeTab];
        savePlan();
        switchTab(getSplitKeys()[0]);
      }
    }

    function getExState(ex) {
      const targetCount = ex.setsCount || 3;
      if (!state[ex.id]) {
        state[ex.id] = {
          note: ex.hint || '',
          sets: Array.from({ length: targetCount }, () => ({ w: ex.weight, r: 12, done: false }))
        };
      }
      while (state[ex.id].sets.length < targetCount) {
        state[ex.id].sets.push({ w: ex.weight, r: 12, done: false });
      }
      if (state[ex.id].sets.length > targetCount) {
        state[ex.id].sets = state[ex.id].sets.slice(0, targetCount);
      }
      return state[ex.id];
    }

    function renderTabsBar() {
      const bar = document.getElementById('split-tabs-bar');
      bar.innerHTML = '';
      const keys = getSplitKeys();

      keys.forEach(k => {
        const btn = document.createElement('button');
        btn.className = `tab ${activeTab === k ? 'active' : ''}`;
        btn.innerText = `Einheit ${k}`;
        btn.onclick = () => switchTab(k);
        bar.appendChild(btn);
      });

      const logBtn = document.createElement('button');
      logBtn.className = `tab ${activeTab === 'LOG' ? 'active' : ''}`;
      logBtn.innerText = '📈 KI & Log';
      logBtn.onclick = () => switchTab('LOG');
      bar.appendChild(logBtn);
    }

    function render() {
      renderTabsBar();

      const isLog = activeTab === 'LOG';
      document.getElementById('p-wrap').style.display = isLog ? 'none' : 'block';
      document.getElementById('t-bar').style.display = isLog ? 'none' : 'flex';

      const container = document.getElementById('workout-container');
      container.innerHTML = '';

      if (isLog) {
        renderLogTab(container);
        return;
      }

      // Meta-Bar für Split
      const keys = getSplitKeys();
      if (keys.length > 2) {
        const meta = document.createElement('div');
        meta.className = 'split-meta-bar';
        meta.innerHTML = `
          <span class="split-meta-title">Aktiver Plan: Einheit ${activeTab}</span>
          <button class="del-split-btn" onclick="removeCurrentSplit()">🗑️ Split ${activeTab} entfernen</button>
        `;
        container.appendChild(meta);
      }

      if (!plan[activeTab]) plan[activeTab] = [];

      plan[activeTab].forEach((ex, exIdx) => {
        const st = getExState(ex);
        const allDoneAndMax = st.sets.every(s => s.done && Number(s.r) >= ex.max);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <div class="ex-title">${exIdx + 1}. ${ex.name}</div>
            <div class="badges">
              ${allDoneAndMax ? `<span class="badge-levelup">⬆️ +${ex.step} kg</span>` : ''}
              <span class="badge-target">${st.sets.length}× ${ex.min}–${ex.max}</span>
              <button class="edit-ex-btn" onclick="openExModal(${exIdx})">✏️ Edit</button>
            </div>
          </div>
          <button class="setup-toggle" onclick="toggleNote('${ex.id}')">⚙️ Setup: <span id="preview-${ex.id}">${st.note || 'hinzufügen'}</span></button>
          <input class="note-box" id="note-${ex.id}" value="${st.note}" oninput="updateNote('${ex.id}', this.value)" placeholder="Sitzhöhe, Polster...">
          <div id="sets-${ex.id}"></div>
        `;
        container.appendChild(card);

        const setsWrap = card.querySelector(`#sets-${ex.id}`);
        st.sets.forEach((s, idx) => {
          const row = document.createElement('div');
          row.className = 'set-row';
          row.innerHTML = `
            <span class="set-num">#${idx + 1}</span>
            <div class="stepper">
              <button class="step-btn" onclick="stepVal('${ex.id}', ${idx}, 'w', -${ex.step})">−</button>
              <input type="number" step="0.5" value="${s.w}" onchange="setVal('${ex.id}', ${idx}, 'w', this.value)">
              <span class="unit-label">kg</span>
              <button class="step-btn" onclick="stepVal('${ex.id}', ${idx}, 'w', ${ex.step})">+</button>
            </div>
            <div class="stepper">
              <button class="step-btn" onclick="stepVal('${ex.id}', ${idx}, 'r', -1)">−</button>
              <input type="number" value="${s.r}" onchange="setVal('${ex.id}', ${idx}, 'r', this.value)">
              <span class="unit-label">Wdh</span>
              <button class="step-btn" onclick="stepVal('${ex.id}', ${idx}, 'r', 1)">+</button>
            </div>
            <button class="done-btn ${s.done ? 'checked' : ''}" onclick="toggleDone('${ex.id}', ${idx}, ${ex.rest})">✓</button>
          `;
          setsWrap.appendChild(row);
        });
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'btn-add-ex';
      addBtn.innerHTML = '➕ Neues Gerät zu Einheit ' + activeTab + ' hinzufügen';
      addBtn.onclick = () => openExModal(null);
      container.appendChild(addBtn);

      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn-finish';
      finishBtn.innerHTML = `✅ Einheit ${activeTab} abschließen & im Logbuch speichern`;
      finishBtn.onclick = saveCurrentWorkoutToLog;
      container.appendChild(finishBtn);

      updateProgress();
    }

    // --- REITER: KI & LOG ---
    function renderLogTab(container) {
      let html = `
        <div class="card">
          <h3 style="margin-top:0; color:var(--primary);">🤖 KI-Analyse & Daten-Export</h3>
          <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px;">Kopiere dein aktuelles Training (nur abgehakte Übungen) oder die gesamte Historie.</p>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn-sm primary" style="flex:1; padding:10px;" onclick="copyForChat()">📋 Aktuelles Training kopieren</button>
            <button class="btn-sm" style="flex:1; padding:10px;" onclick="copyFullHistory()">📈 Alle Logs kopieren</button>
          </div>
        </div>

        <h3 style="font-size:1.05rem; margin:16px 0 10px 4px;">Trainings-Historie (${logs.length})</h3>
      `;

      if (logs.length === 0) {
        html += `<div class="card" style="text-align:center; color:var(--muted); font-size:0.85rem; padding:24px;">Noch keine Trainings gespeichert. Hake deine gemachten Sätze grün ab und tippe unten auf den Abschluss-Button!</div>`;
      } else {
        logs.forEach((log, idx) => {
          const miniRows = log.exercises.map(ex => {
            const weights = ex.sets.map(s => s.w);
            const sameWeight = weights.every(w => w === weights[0]);
            const weightStr = sameWeight ? `${weights[0]} kg` : weights.map(w => `${w}kg`).join('/');
            const repsStr = ex.sets.map(s => s.r).join('/');
            return `
              <div class="log-mini-row">
                <span class="log-mini-name">${ex.name}</span>
                <span class="log-mini-val">${weightStr} — ${repsStr}</span>
              </div>
            `;
          }).join('');

          html += `
            <div class="log-item">
              <div class="log-item-header">
                <span class="log-title">Einheit ${log.unit}</span>
                <span class="log-date">${log.date}</span>
              </div>
              <div class="log-stats">
                <strong>Gesamtvolumen:</strong> ${log.totalVolume.toLocaleString('de-DE')} kg | <strong>Übungen:</strong> ${log.exercises.length}
                ${log.note ? ` | 📝 <em>"${log.note}"</em>` : ''}
              </div>
              <div class="log-mini-table">
                ${miniRows}
              </div>
              <div class="log-actions">
                <button class="btn-sm primary" onclick="openEditLogModal(${idx})">✏️ Bearbeiten</button>
                <button class="btn-sm" onclick="loadLogIntoWorkout(${idx})">📥 Ins Training laden</button>
                <button class="btn-sm" onclick="copySingleLog(${idx})">📋 Kopieren</button>
                <button class="btn-sm danger" onclick="deleteLog(${idx})">🗑️</button>
              </div>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    // --- GERÄTE-MODAL ---
    function openExModal(exIdx) {
      editingExIndex = exIdx;
      const chipsWrap = document.getElementById('preset-chips');
      chipsWrap.innerHTML = gym80Presets.map((p, i) =>
        `<button class="chip" onclick="applyPreset(${i})">${p.name}</button>`
      ).join('');

      if (exIdx !== null) {
        const ex = plan[activeTab][exIdx];
        document.getElementById('ex-modal-title').innerText = 'Gerät bearbeiten';
        document.getElementById('ex-name-input').value = ex.name;
        document.getElementById('ex-min-input').value = ex.min;
        document.getElementById('ex-max-input').value = ex.max;
        document.getElementById('ex-weight-input').value = ex.weight;
        document.getElementById('ex-step-input').value = ex.step;
        document.getElementById('ex-rest-input').value = ex.rest;
        document.getElementById('ex-sets-input').value = ex.setsCount || 3;
        document.getElementById('ex-hint-input').value = ex.hint || '';
        document.getElementById('ex-move-controls').style.display = 'flex';
      } else {
        document.getElementById('ex-modal-title').innerText = 'Neues Gerät hinzufügen';
        document.getElementById('ex-name-input').value = '';
        document.getElementById('ex-min-input').value = 10;
        document.getElementById('ex-max-input').value = 12;
        document.getElementById('ex-weight-input').value = 30;
        document.getElementById('ex-step-input').value = 2.5;
        document.getElementById('ex-rest-input').value = 90;
        document.getElementById('ex-sets-input').value = 3;
        document.getElementById('ex-hint-input').value = '';
        document.getElementById('ex-move-controls').style.display = 'none';
      }
      document.getElementById('edit-ex-modal').classList.add('open');
    }

    function applyPreset(i) {
      const p = gym80Presets[i];
      document.getElementById('ex-name-input').value = p.name;
      document.getElementById('ex-min-input').value = p.min;
      document.getElementById('ex-max-input').value = p.max;
      document.getElementById('ex-weight-input').value = p.weight;
      document.getElementById('ex-step-input').value = p.step;
      document.getElementById('ex-rest-input').value = p.rest;
      document.getElementById('ex-hint-input').value = p.hint;
    }

    function closeExModal() {
      document.getElementById('edit-ex-modal').classList.remove('open');
      editingExIndex = null;
    }

    function saveExerciseModal() {
      const name = document.getElementById('ex-name-input').value.trim() || 'Gym80 Gerät';
      const min = parseInt(document.getElementById('ex-min-input').value) || 8;
      const max = parseInt(document.getElementById('ex-max-input').value) || 12;
      const weight = parseFloat(document.getElementById('ex-weight-input').value) || 20;
      const step = parseFloat(document.getElementById('ex-step-input').value) || 2.5;
      const rest = parseInt(document.getElementById('ex-rest-input').value) || 90;
      const setsCount = Math.min(5, Math.max(1, parseInt(document.getElementById('ex-sets-input').value) || 3));
      const hint = document.getElementById('ex-hint-input').value;

      if (editingExIndex !== null) {
        const ex = plan[activeTab][editingExIndex];
        ex.name = name; ex.min = min; ex.max = max; ex.weight = weight; ex.step = step; ex.rest = rest; ex.setsCount = setsCount; ex.hint = hint;
        if (state[ex.id]) state[ex.id].note = hint;
      } else {
        const newId = activeTab.toLowerCase() + '_' + Date.now();
        plan[activeTab].push({ id: newId, name, min, max, weight, step, rest, setsCount, hint });
      }
      savePlan();
      saveState();
      closeExModal();
      render();
    }

    function moveExercise(dir) {
      if (editingExIndex === null) return;
      const list = plan[activeTab];
      const target = editingExIndex + dir;
      if (target < 0 || target >= list.length) return;
      const temp = list[editingExIndex];
      list[editingExIndex] = list[target];
      list[target] = temp;
      editingExIndex = target;
      savePlan();
      render();
    }

    function deleteExercise() {
      if (editingExIndex === null) return;
      if (!confirm('Dieses Gerät wirklich aus dem Plan entfernen?')) return;
      plan[activeTab].splice(editingExIndex, 1);
      savePlan();
      closeExModal();
      render();
    }

    // --- LOGGING ---
    function saveCurrentWorkoutToLog() {
      if (activeTab === 'LOG') return;
      const list = plan[activeTab] || [];
      let totalVolume = 0;
      let exercises = [];

      list.forEach(ex => {
        const st = getExState(ex);
        const doneSets = st.sets.filter(s => s.done);
        if (doneSets.length === 0) return;

        let setsData = [];
        doneSets.forEach(s => {
          const w = parseFloat(s.w) || 0;
          const r = parseInt(s.r) || 0;
          totalVolume += (w * r);
          setsData.push({ w, r, done: true });
        });
        exercises.push({ id: ex.id, name: ex.name, note: st.note, sets: setsData });
      });

      if (exercises.length === 0) {
        alert('⚠️ Du hast noch keinen Satz mit dem grünen Haken (✓) markiert!');
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

      logs.unshift({
        id: 'log_' + Date.now(),
        unit: activeTab,
        date: dateStr,
        totalVolume,
        note: '',
        exercises
      });

      saveLogs();
      alert(`✅ Einheit ${activeTab} gespeichert! (${exercises.length} Übungen | ${totalVolume.toLocaleString('de-DE')} kg)`);
    }

    function openEditLogModal(index) {
      currentEditingLogIndex = index;
      const log = logs[index];
      document.getElementById('edit-log-date').value = log.date;
      document.getElementById('edit-log-note').value = log.note || '';

      const wrap = document.getElementById('edit-log-exercises');
      wrap.innerHTML = '';

      log.exercises.forEach((ex, exIdx) => {
        let setsHtml = '';
        ex.sets.forEach((s, sIdx) => {
          setsHtml += `
            <div style="display:flex; align-items:center; gap:6px; margin-top:4px;">
              <span style="font-size:0.75rem; color:var(--muted); width:22px;">#${sIdx + 1}</span>
              <input type="number" step="0.5" id="medit_w_${exIdx}_${sIdx}" value="${s.w}" style="width:74px; background:#1e2430; border:1px solid var(--card-border); color:#fff; border-radius:6px; padding:5px; text-align:center;"> kg
              <input type="number" id="medit_r_${exIdx}_${sIdx}" value="${s.r}" style="width:64px; background:#1e2430; border:1px solid var(--card-border); color:#fff; border-radius:6px; padding:5px; text-align:center;"> Wdh
            </div>
          `;
        });

        wrap.innerHTML += `
          <div style="background:#151921; padding:8px 10px; border-radius:8px; margin-top:8px; border:1px solid var(--card-border);">
            <div style="font-weight:700; font-size:0.85rem; color:var(--primary);">${ex.name}</div>
            ${setsHtml}
          </div>
        `;
      });

      document.getElementById('edit-log-modal').classList.add('open');
    }

    function closeEditLogModal() {
      document.getElementById('edit-log-modal').classList.remove('open');
      currentEditingLogIndex = null;
    }

    function saveEditedLog() {
      if (currentEditingLogIndex === null) return;
      const log = logs[currentEditingLogIndex];
      log.date = document.getElementById('edit-log-date').value;
      log.note = document.getElementById('edit-log-note').value;

      let newVolume = 0;
      log.exercises.forEach((ex, exIdx) => {
        ex.sets.forEach((s, sIdx) => {
          const wInput = document.getElementById(`medit_w_${exIdx}_${sIdx}`);
          const rInput = document.getElementById(`medit_r_${exIdx}_${sIdx}`);
          if (wInput && rInput) {
            s.w = parseFloat(wInput.value) || 0;
            s.r = parseInt(rInput.value) || 0;
            newVolume += (s.w * s.r);
          }
        });
      });
      log.totalVolume = newVolume;

      saveLogs();
      closeEditLogModal();
      render();
    }

    function loadLogIntoWorkout(index) {
      const log = logs[index];
      if (!confirm(`Möchtest du Einheit ${log.unit} vom ${log.date} zurück in die aktive Trainingsansicht laden?`)) return;

      if (!plan[log.unit]) {
        plan[log.unit] = [];
        savePlan();
      }

      plan[log.unit].forEach(ex => {
        getExState(ex).sets.forEach(s => { s.done = false; s.r = 12; });
      });

      log.exercises.forEach(ex => {
        if (!state[ex.id]) state[ex.id] = { note: ex.note || '', sets: [] };
        const targetCount = (plan[log.unit].find(p => p.id === ex.id)?.setsCount) || 3;
        const newSets = [];
        for (let i = 0; i < targetCount; i++) {
          if (ex.sets[i]) {
            newSets.push({ w: ex.sets[i].w, r: ex.sets[i].r, done: true });
          } else {
            const fallbackW = ex.sets[0]?.w || 20;
            newSets.push({ w: fallbackW, r: 12, done: false });
          }
        }
        state[ex.id].sets = newSets;
      });

      saveState();
      switchTab(log.unit);
    }

    function deleteLog(index) {
      if (!confirm('Diesen Log-Eintrag wirklich löschen?')) return;
      logs.splice(index, 1);
      saveLogs();
      render();
    }

    // --- ALLGEMEINE STEUERUNG ---
    function toggleNote(id) { document.getElementById(`note-${id}`).classList.toggle('open'); }
    function updateNote(id, val) { state[id].note = val; document.getElementById(`preview-${id}`).innerText = val || 'hinzufügen'; saveState(); }
    function stepVal(id, idx, field, delta) {
      let cur = parseFloat(state[id].sets[idx][field]) || 0;
      state[id].sets[idx][field] = Math.max(0, +(cur + delta).toFixed(1));
      saveState();
      render();
    }
    function setVal(id, idx, field, val) { state[id].sets[idx][field] = parseFloat(val) || 0; saveState(); render(); }
    function toggleDone(id, idx, restSeconds) {
      const target = state[id].sets[idx];
      target.done = !target.done;
      saveState();
      render();
      if (target.done) startTimer(restSeconds);
    }
    function switchTab(tab) {
      activeTab = tab;
      if (tab !== 'LOG') localStorage.setItem('gym80_active_tab', tab);
      render();
    }
    function updateProgress() {
      if (activeTab === 'LOG' || !plan[activeTab]) return;
      const list = plan[activeTab];
      let total = 0, done = 0;
      list.forEach(ex => {
        const st = getExState(ex);
        total += st.sets.length;
        st.sets.forEach(s => { if (s.done) done++; });
      });
      document.getElementById('progress-fill').style.width = total ? `${(done / total) * 100}%` : '0%';
    }
    function resetChecks() {
      const unit = activeTab === 'LOG' ? (localStorage.getItem('gym80_active_tab') || 'A') : activeTab;
      if (!confirm(`Alle Haken für Einheit ${unit} entfernen und Wiederholungen wieder auf 12 vorbelegen?`)) return;
      if (plan[unit]) {
        plan[unit].forEach(ex => {
          getExState(ex).sets.forEach(s => {
            s.done = false;
            s.r = 12;
          });
        });
      }
      saveState();
      render();
    }

    function copyForChat() {
      const unit = activeTab === 'LOG' ? (localStorage.getItem('gym80_active_tab') || 'A') : activeTab;
      let lines = [`Me Fitness – Einheit ${unit} (${new Date().toLocaleDateString('de-DE')}):`];
      let count = 0;
      if (plan[unit]) {
        plan[unit].forEach(ex => {
          const st = getExState(ex);
          const doneSets = st.sets.filter(s => s.done);
          if (doneSets.length === 0) return;
          count++;
          const w = doneSets[0].w;
          const reps = doneSets.map(s => s.r).join('/');
          lines.push(`${ex.name}: ${w} kg — ${reps}`);
        });
      }
      if (count === 0) {
        alert('⚠️ Es sind noch keine Sätze grün abgehakt!');
        return;
      }
      lines.push('\nBitte werte meine Leistung aus und sag mir, wo ich steigern kann.');
      navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Für den Chat kopiert (nur abgehakte Übungen)!'));
    }

    function copySingleLog(index) {
      const log = logs[index];
      let lines = [`Me Fitness Log – Einheit ${log.unit} (${log.date}):`, `Gesamtvolumen: ${log.totalVolume} kg`];
      log.exercises.forEach(ex => {
        const w = ex.sets[0]?.w || 0;
        const reps = ex.sets.map(s => s.r).join('/');
        lines.push(`${ex.name}: ${w} kg — ${reps}`);
      });
      navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Log kopiert!'));
    }

    function copyFullHistory() {
      if (logs.length === 0) return alert('Noch keine Logs gespeichert.');
      let lines = ['Me Fitness Trainingshistorie:\n'];
      logs.forEach(log => {
        lines.push(`=== Einheit ${log.unit} (${log.date}) | Volumen: ${log.totalVolume} kg ===`);
        log.exercises.forEach(ex => {
          lines.push(`${ex.name}: ${ex.sets[0]?.w || 0} kg — ${ex.sets.map(s => s.r).join('/')}`);
        });
        lines.push('');
      });
      navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Komplette Historie kopiert!'));
    }

    // --- ECHTZEIT-TIMER ---
    let timerEnd = null, remainingSec = 90, timerInterval = null;
    function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
    function updateTimerUI() {
      document.getElementById('timer-readout').innerText = formatTime(remainingSec);
      document.getElementById('timer-toggle').innerText = timerInterval ? 'Pause' : 'Start';
    }
    function startTimer(s) {
      clearInterval(timerInterval);
      remainingSec = s;
      timerEnd = Date.now() + remainingSec * 1000;
      document.getElementById('timer-status').innerText = `Pause läuft (${s}s)`;
      timerInterval = setInterval(() => {
        const diff = Math.round((timerEnd - Date.now()) / 1000);
        if (diff <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          remainingSec = 0;
          document.getElementById('timer-status').innerText = '🔥 Weiter geht’s! Nächster Satz!';
        } else { remainingSec = diff; }
        updateTimerUI();
      }, 250);
      updateTimerUI();
    }
    function toggleTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; document.getElementById('timer-status').innerText = 'Timer pausiert'; }
      else startTimer(remainingSec > 0 ? remainingSec : 90);
      updateTimerUI();
    }
    function adjustTimer(d) { remainingSec = Math.max(0, remainingSec + d); if (timerInterval) timerEnd = Date.now() + remainingSec * 1000; updateTimerUI(); }
    function resetTimer(s = 90) { clearInterval(timerInterval); timerInterval = null; remainingSec = s; document.getElementById('timer-status').innerText = 'Pausentimer bereit'; updateTimerUI(); }

    render();
    updateTimerUI();
  </script>
</body>
</html>
