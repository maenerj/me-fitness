<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Me Fitness">
  <title>Me Fitness Pro</title>
  <style>
    :root {
      --bg: #0b0d11;
      --card: #151921;
      --card-border: #262c3a;
      --primary: #f59e0b;
      --primary-dim: rgba(245, 158, 11, 0.15);
      --success: #10b981;
      --danger: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 110px) 14px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand h1 { font-size: 1.35rem; margin: 0; color: var(--primary); font-weight: 800; }
    .brand span { font-size: 0.78rem; color: var(--muted); }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs {
      display: flex;
      background: #11141b;
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px 4px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      text-align: center;
    }
    .tab.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .progress-bar-wrap {
      background: #151921;
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, var(--primary), var(--success));
      height: 100%;
      width: 0%;
      transition: width 0.25s ease;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .ex-title { font-weight: 700; font-size: 1.02rem; }
    .badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge-target {
      font-size: 0.75rem;
      background: var(--primary-dim);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }
    .badge-levelup {
      font-size: 0.72rem;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: 700;
    }
    .setup-toggle {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      padding: 0;
      margin-bottom: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .note-box {
      width: 100%;
      background: #0e1117;
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.82rem;
      margin-bottom: 10px;
      display: none;
    }
    .note-box.open { display: block; }
    .set-row {
      display: grid;
      grid-template-columns: 26px 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    .set-num { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
    .stepper {
      display: flex;
      align-items: center;
      background: #0e1117;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .step-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      width: 28px;
      height: 36px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .stepper input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      text-align: center;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 0;
    }
    .unit-label { font-size: 0.68rem; color: var(--muted); padding-right: 6px; }
    .done-btn {
      width: 40px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #0e1117;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .done-btn.checked {
      background: var(--success);
      border-color: var(--success);
      color: #052e16;
    }
    .btn-finish {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      margin-top: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    /* Floating Timer Bar */
    .timer-bar {
      position: fixed;
      bottom: env(safe-area-inset-bottom, 12px);
      left: 12px;
      right: 12px;
      background: rgba(21, 25, 33, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 100;
    }
    .timer-display {
      font-size: 1.35rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
    }
    .timer-sub { font-size: 0.7rem; color: var(--muted); display: block; }
    .timer-controls { display: flex; gap: 6px; }
    .t-btn {
      background: #232936;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .t-btn.primary { background: var(--primary); color: #000; border-color: var(--primary); }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 14px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-header h3 { margin: 0; font-size: 1.15rem; color: var(--primary); }
    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
    }
    .log-item {
      background: #0e1117;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .log-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .log-title { font-weight: 800; font-size: 0.95rem; color: var(--primary); }
    .log-date { font-size: 0.75rem; color: var(--muted); }
    .log-stats { font-size: 0.8rem; margin-bottom: 8px; color: var(--text); }
    .log-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .btn-sm {
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: #1e2430;
      color: var(--text);
    }
    .btn-sm.primary { background: var(--primary); color: #000; border-color: var(--primary); }
    .btn-sm.danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border-color: var(--danger); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Me Fitness</h1>
      <span id="date-str">Gym80 Ganzkörper-Split</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="saveCurrentWorkoutToLog()" title="Training jetzt speichern">💾 Loggen</button>
      <button class="icon-btn" onclick="copyForChat()" title="Für Chat kopieren">📋 Kopieren</button>
      <button class="icon-btn" onclick="resetChecks()" title="Sätze zurücksetzen">🔄 Reset</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-A" onclick="switchTab('A')">Einheit A</button>
    <button class="tab" id="tab-B" onclick="switchTab('B')">Einheit B</button>
    <button class="tab" id="tab-LOG" onclick="switchTab('LOG')">📈 KI & Log</button>
  </div>

  <div class="progress-bar-wrap" id="p-wrap">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div id="workout-container"></div>

  <!-- Floating Timer -->
  <div class="timer-bar" id="t-bar">
    <div>
      <span class="timer-sub" id="timer-status">Pausentimer bereit</span>
      <span class="timer-display" id="timer-readout">01:30</span>
    </div>
    <div class="timer-controls">
      <button class="t-btn" onclick="adjustTimer(-15)">-15s</button>
      <button class="t-btn" onclick="adjustTimer(15)">+15s</button>
      <button class="t-btn primary" id="timer-toggle" onclick="toggleTimer()">Start</button>
      <button class="t-btn" onclick="resetTimer(90)">↺</button>
    </div>
  </div>

  <!-- Modal zum Bearbeiten eines Logs -->
  <div class="modal-overlay" id="edit-log-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Eintrag bearbeiten</h3>
        <button class="close-modal-btn" onclick="closeEditModal()">×</button>
      </div>
      <div style="margin-bottom: 12px;">
        <label style="font-size:0.75rem; color:var(--muted);">Datum & Uhrzeit:</label>
        <input type="text" id="edit-log-date" style="width:100%; background:#0e1117; border:1px solid var(--card-border); color:#fff; padding:8px; border-radius:8px; margin-top:4px;">
      </div>
      <div style="margin-bottom: 12px;">
        <label style="font-size:0.75rem; color:var(--muted);">Trainings-Notiz / Tagesform:</label>
        <input type="text" id="edit-log-note" style="width:100%; background:#0e1117; border:1px solid var(--card-border); color:#fff; padding:8px; border-radius:8px; margin-top:4px;">
      </div>
      <div id="edit-log-exercises"></div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn-sm primary" style="flex:1; padding:10px;" onclick="saveEditedLog()">Änderungen speichern</button>
        <button class="btn-sm" style="padding:10px;" onclick="closeEditModal()">Abbrechen</button>
      </div>
    </div>
  </div>

  <script>
    const defaultPlan = {
      A: [
        { id: "a1", name: "1. Beinpresse 45°", min: 8, max: 10, weight: 130, step: 5, rest: 120, hint: "Füße mittig, schulterbreit" },
        { id: "a2", name: "2. Beinstrecker", min: 10, max: 12, weight: 65, step: 2.5, rest: 90, hint: "Oben 1 Sekunde halten" },
        { id: "a3", name: "3. Brustpresse flach", min: 8, max: 10, weight: 27.5, step: 2.5, rest: 90, hint: "Schulterblätter fixiert" },
        { id: "a4", name: "4. Rudern brustgestützt", min: 8, max: 10, weight: 50, step: 2.5, rest: 90, hint: "Ellbogen eng am Körper" },
        { id: "a5", name: "5. Latzug breit", min: 10, max: 12, weight: 55, step: 2.5, rest: 90, hint: "Zur oberen Brust ziehen" },
        { id: "a6", name: "6. Seithebemaschine", min: 12, max: 15, weight: 20, step: 2.5, rest: 60, hint: "Seitliche Schulter" },
        { id: "a7", name: "7. Kabelzug Trizepsdrücken", min: 10, max: 12, weight: 20, step: 2.5, rest: 60, hint: "Ellbogen fest am Körper" },
        { id: "a8", name: "8. Bauchmaschine", min: 12, max: 15, weight: 90, step: 2.5, rest: 60, hint: "Rollende Bewegung aus Rippen" }
      ],
      B: [
        { id: "b1", name: "1. Beinpresse (Füße hoch)", min: 10, max: 12, weight: 125, step: 5, rest: 120, hint: "Füße weit oben für Gesäß/Beinbeuger" },
        { id: "b2", name: "2. Beinbeuger sitzend", min: 10, max: 12, weight: 65, step: 2.5, rest: 90, hint: "Fersen aktiv anziehen" },
        { id: "b3", name: "3. Schräg-Brustpresse", min: 8, max: 10, weight: 25, step: 2.5, rest: 90, hint: "Obere Brust" },
        { id: "b4", name: "4. Latzug eng (Parallel)", min: 8, max: 10, weight: 60, step: 2.5, rest: 90, hint: "Enger Griff, Lat-Fokus" },
        { id: "b5", name: "5. Butterfly", min: 10, max: 12, weight: 25, step: 2.5, rest: 60, hint: "Arme leicht gebeugt" },
        { id: "b6", name: "6. Reverse Butterfly", min: 12, max: 15, weight: 25, step: 2.5, rest: 60, hint: "Hintere Schulter" },
        { id: "b7", name: "7. Bizepscurls", min: 10, max: 12, weight: 22.5, step: 2.5, rest: 60, hint: "Ohne Schwung" },
        { id: "b8", name: "8. Rumpfstrecker / Bauch", min: 12, max: 15, weight: 90, step: 2.5, rest: 60, hint: "Rückenstrecker oder Crunch" }
      ]
    };

    let activeTab = localStorage.getItem('gym80_active_tab') || 'A';
    let state = JSON.parse(localStorage.getItem('gym80_pro_state') || '{}');
    let logs = JSON.parse(localStorage.getItem('me_fitness_logs') || '[]');
    let currentEditingLogIndex = null;

    function saveState() {
      localStorage.setItem('gym80_pro_state', JSON.stringify(state));
      updateProgress();
    }

    function saveLogs() {
      localStorage.setItem('me_fitness_logs', JSON.stringify(logs));
    }

    function getExState(ex) {
      if (!state[ex.id]) {
        state[ex.id] = {
          note: ex.hint,
          sets: [
            { w: ex.weight, r: ex.min, done: false },
            { w: ex.weight, r: ex.min, done: false },
            { w: ex.weight, r: ex.min, done: false }
          ]
        };
      }
      return state[ex.id];
    }

    function render() {
      document.getElementById('tab-A').classList.toggle('active', activeTab === 'A');
      document.getElementById('tab-B').classList.toggle('active', activeTab === 'B');
      document.getElementById('tab-LOG').classList.toggle('active', activeTab === 'LOG');

      const isLog = activeTab === 'LOG';
      document.getElementById('p-wrap').style.display = isLog ? 'none' : 'block';
      document.getElementById('t-bar').style.display = isLog ? 'none' : 'flex';

      const container = document.getElementById('workout-container');
      container.innerHTML = '';

      if (isLog) {
        renderLogTab(container);
        return;
      }

      defaultPlan[activeTab].forEach(ex => {
        const st = getExState(ex);
        const allMax = st.sets.every(s => Number(s.r) >= ex.max);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <div class="ex-title">${ex.name}</div>
            <div class="badges">
              ${allMax ? `<span class="badge-levelup">⬆️ +${ex.step} kg bereit!</span>` : ''}
              <span class="badge-target">3× ${ex.min}–${ex.max} | ${ex.rest}s</span>
            </div>
          </div>
          <button class="setup-toggle" onclick="toggleNote('${ex.id}')">⚙️ Setup: <span id="preview-${ex.id}">${st.note}</span></button>
          <input class="note-box" id="note-${ex.id}" value="${st.note}" oninput="updateNote('${ex.id}', this.value)" placeholder="Sitzhöhe, Polster...">
          <div id="sets-${ex.id}"></div>
        `;
        container.appendChild(card);

        const setsWrap = card.querySelector(`#sets-${ex.id}`);
        st.sets.forEach((s, idx) => {
          const row = document.createElement('div');
          row.className = 'set-row';
          row.innerHTML = `
            <span class="set-num">#${idx + 1}</span>
            <div class="stepper">
              <button class="step-btn" onclick="stepVal('${ex.id}', ${idx}, 'w', -${ex.step})">−</button>
              <input type="number" step="0.5" value="${s.w}" onchange="setVal('${ex.id}', ${idx}, 'w', this.value)">
              <span class="unit-label">kg</span>
              <button class="step-btn" onclick="stepVal('${ex.id}', ${idx}, 'w', ${ex.step})">+</button>
            </div>
            <div class="stepper">
              <button class="step-btn" onclick="stepVal('${ex.id}', ${idx}, 'r', -1)">−</button>
              <input type="number" value="${s.r}" onchange="setVal('${ex.id}', ${idx}, 'r', this.value)">
              <span class="unit-label">Wdh</span>
              <button class="step-btn" onclick="stepVal('${ex.id}', ${idx}, 'r', 1)">+</button>
            </div>
            <button class="done-btn ${s.done ? 'checked' : ''}" onclick="toggleDone('${ex.id}', ${idx}, ${ex.rest})">✓</button>
          `;
          setsWrap.appendChild(row);
        });
      });

      const finishBtn = document.createElement('button');
      finishBtn.className = 'btn-finish';
      finishBtn.innerHTML = '✅ Training abschließen & im Logbuch speichern';
      finishBtn.onclick = saveCurrentWorkoutToLog;
      container.appendChild(finishBtn);

      updateProgress();
    }

    function renderLogTab(container) {
      let html = `
        <div class="card">
          <h3 style="margin-top:0; color:var(--primary);">🤖 KI-Analyse & Daten-Export</h3>
          <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px;">Kopiere deine Daten mit einem Klick, um sie von ChatGPT oder Gemini auswerten zu lassen.</p>
          <div style="display:flex; gap:8px;">
            <button class="btn-sm primary" style="flex:1; padding:10px;" onclick="copyForChat()">📋 Aktuelles Training kopieren</button>
            <button class="btn-sm" style="flex:1; padding:10px;" onclick="copyFullHistory()">📈 Alle Logs kopieren</button>
          </div>
        </div>

        <h3 style="font-size:1.1rem; margin:16px 0 10px 4px;">Trainings-Historie (${logs.length})</h3>
      `;

      if (logs.length === 0) {
        html += `<div class="card" style="text-align:center; color:var(--muted); font-size:0.85rem; padding:24px;">Noch keine Trainings gespeichert. Schließe dein erstes Training mit dem grünen Button ab!</div>`;
      } else {
        logs.forEach((log, idx) => {
          html += `
            <div class="log-item">
              <div class="log-item-header">
                <span class="log-title">Einheit ${log.unit}</span>
                <span class="log-date">${log.date}</span>
              </div>
              <div class="log-stats">
                <strong>Volumen:</strong> ${log.totalVolume.toLocaleString('de-DE')} kg | <strong>Übungen:</strong> ${log.exercises.length}
                ${log.note ? `<br><em>"${log.note}"</em>` : ''}
              </div>
              <div class="log-actions">
                <button class="btn-sm primary" onclick="openEditModal(${idx})">✏️ Bearbeiten</button>
                <button class="btn-sm" onclick="loadLogIntoWorkout(${idx})">📥 Ins Training laden</button>
                <button class="btn-sm" onclick="copySingleLog(${idx})">📋 Text</button>
                <button class="btn-sm danger" onclick="deleteLog(${idx})">🗑️ Löschen</button>
              </div>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    // --- LOGGING & BEARBEITEN ---
    function saveCurrentWorkoutToLog() {
      const list = defaultPlan[activeTab];
      let totalVolume = 0;
      let exercises = [];

      list.forEach(ex => {
        const st = getExState(ex);
        let setsData = [];
        st.sets.forEach(s => {
          const w = parseFloat(s.w) || 0;
          const r = parseInt(s.r) || 0;
          totalVolume += (w * r);
          setsData.push({ w, r, done: s.done });
        });
        exercises.push({
          id: ex.id,
          name: ex.name,
          note: st.note,
          sets: setsData
        });
      });

      const now = new Date();
      const dateStr = now.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

      logs.unshift({
        id: 'log_' + Date.now(),
        unit: activeTab,
        date: dateStr,
        totalVolume,
        note: '',
        exercises
      });

      saveLogs();
      alert(`✅ Einheit ${activeTab} erfolgreich mit ${totalVolume.toLocaleString('de-DE')} kg Gesamtvolumen gespeichert!`);
    }

    function openEditModal(index) {
      currentEditingLogIndex = index;
      const log = logs[index];
      document.getElementById('edit-log-date').value = log.date;
      document.getElementById('edit-log-note').value = log.note || '';

      const wrap = document.getElementById('edit-log-exercises');
      wrap.innerHTML = '';

      log.exercises.forEach((ex, exIdx) => {
        let setsHtml = '';
        ex.sets.forEach((s, sIdx) => {
          setsHtml += `
            <div style="display:flex; align-items:center; gap:6px; margin-top:4px;">
              <span style="font-size:0.75rem; color:var(--muted); width:20px;">#${sIdx + 1}</span>
              <input type="number" step="0.5" id="medit_w_${exIdx}_${sIdx}" value="${s.w}" style="width:70px; background:#1e2430; border:1px solid var(--card-border); color:#fff; border-radius:6px; padding:4px; text-align:center;"> kg
              <input type="number" id="medit_r_${exIdx}_${sIdx}" value="${s.r}" style="width:60px; background:#1e2430; border:1px solid var(--card-border); color:#fff; border-radius:6px; padding:4px; text-align:center;"> Wdh
            </div>
          `;
        });

        wrap.innerHTML += `
          <div style="background:#151921; padding:8px 10px; border-radius:8px; margin-top:8px; border:1px solid var(--card-border);">
            <div style="font-weight:700; font-size:0.85rem; color:var(--primary);">${ex.name}</div>
            ${setsHtml}
          </div>
        `;
      });

      document.getElementById('edit-log-modal').classList.add('open');
    }

    function closeEditModal() {
      document.getElementById('edit-log-modal').classList.remove('open');
      currentEditingLogIndex = null;
    }

    function saveEditedLog() {
      if (currentEditingLogIndex === null) return;
      const log = logs[currentEditingLogIndex];
      log.date = document.getElementById('edit-log-date').value;
      log.note = document.getElementById('edit-log-note').value;

      let newVolume = 0;
      log.exercises.forEach((ex, exIdx) => {
        ex.sets.forEach((s, sIdx) => {
          const wInput = document.getElementById(`medit_w_${exIdx}_${sIdx}`);
          const rInput = document.getElementById(`medit_r_${exIdx}_${sIdx}`);
          if (wInput && rInput) {
            s.w = parseFloat(wInput.value) || 0;
            s.r = parseInt(rInput.value) || 0;
            newVolume += (s.w * s.r);
          }
        });
      });
      log.totalVolume = newVolume;

      saveLogs();
      closeEditModal();
      render();
      alert('Änderungen am Log erfolgreich gespeichert!');
    }

    function loadLogIntoWorkout(index) {
      const log = logs[index];
      if (!confirm(`Möchtest du Einheit ${log.unit} vom ${log.date} zurück in die aktive Trainingsansicht laden? Aktuelle Werte werden überschrieben.`)) return;

      log.exercises.forEach(ex => {
        if (!state[ex.id]) state[ex.id] = { note: ex.note || '', sets: [] };
        state[ex.id].sets = ex.sets.map(s => ({ w: s.w, r: s.r, done: true }));
      });

      saveState();
      switchTab(log.unit);
      alert(`Einheit ${log.unit} geladen! Du kannst die Werte nun im Plan anpassen.`);
    }

    function deleteLog(index) {
      if (!confirm('Diesen Eintrag wirklich unwiderruflich löschen?')) return;
      logs.splice(index, 1);
      saveLogs();
      render();
    }

    // --- HILFSFUNKTIONEN & TIMER ---
    function toggleNote(id) { document.getElementById(`note-${id}`).classList.toggle('open'); }
    function updateNote(id, val) { state[id].note = val; document.getElementById(`preview-${id}`).innerText = val || 'hinzufügen'; saveState(); }
    function stepVal(id, idx, field, delta) {
      let cur = parseFloat(state[id].sets[idx][field]) || 0;
      state[id].sets[idx][field] = Math.max(0, +(cur + delta).toFixed(1));
      saveState();
      render();
    }
    function setVal(id, idx, field, val) { state[id].sets[idx][field] = parseFloat(val) || 0; saveState(); render(); }
    function toggleDone(id, idx, restSeconds) {
      const target = state[id].sets[idx];
      target.done = !target.done;
      saveState();
      render();
      if (target.done) startTimer(restSeconds);
    }
    function switchTab(tab) {
      activeTab = tab;
      if (tab !== 'LOG') localStorage.setItem('gym80_active_tab', tab);
      render();
    }
    function updateProgress() {
      if (activeTab === 'LOG') return;
      const list = defaultPlan[activeTab];
      let total = list.length * 3;
      let done = 0;
      list.forEach(ex => { getExState(ex).sets.forEach(s => { if (s.done) done++; }); });
      document.getElementById('progress-fill').style.width = `${(done / total) * 100}%`;
    }
    function resetChecks() {
      if (activeTab === 'LOG') return;
      if (!confirm(`Alle Haken für Einheit ${activeTab} zurücksetzen?`)) return;
      defaultPlan[activeTab].forEach(ex => { getExState(ex).sets.forEach(s => s.done = false); });
      saveState();
      render();
    }

    function copyForChat() {
      let lines = [`Me Fitness – Einheit ${activeTab} (${new Date().toLocaleDateString('de-DE')}):`];
      defaultPlan[activeTab].forEach(ex => {
        const st = getExState(ex);
        const w = st.sets[0].w;
        const reps = st.sets.map(s => s.r).join('/');
        lines.push(`${ex.name}: ${w} kg — ${reps}`);
      });
      lines.push('\nBitte werte meine Leistung aus und gib mir Feedback zur Steigerung.');
      navigator.clipboard.writeText(lines.join('\n')).then(() => alert('In Zwischenablage kopiert!'));
    }

    function copySingleLog(index) {
      const log = logs[index];
      let lines = [`Me Fitness Log – Einheit ${log.unit} (${log.date}):`, `Gesamtvolumen: ${log.totalVolume} kg`];
      log.exercises.forEach(ex => {
        const reps = ex.sets.map(s => `${s.w}kg×${s.r}`).join(' | ');
        lines.push(`${ex.name}: ${reps}`);
      });
      navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Log-Eintrag kopiert!'));
    }

    function copyFullHistory() {
      if (logs.length === 0) return alert('Noch keine Logs vorhanden.');
      let lines = ['Me Fitness Trainingshistorie:\n'];
      logs.forEach(log => {
        lines.push(`=== Einheit ${log.unit} am ${log.date} (Volumen: ${log.totalVolume} kg) ===`);
        log.exercises.forEach(ex => {
          lines.push(`${ex.name}: ${ex.sets.map(s => `${s.w}kg×${s.r}`).join(', ')}`);
        });
        lines.push('');
      });
      navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Gesamte Historie kopiert!'));
    }

    // Timer
    let timerEnd = null, remainingSec = 90, timerInterval = null;
    function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
    function updateTimerUI() {
      document.getElementById('timer-readout').innerText = formatTime(remainingSec);
      document.getElementById('timer-toggle').innerText = timerInterval ? 'Pause' : 'Start';
    }
    function startTimer(s) {
      clearInterval(timerInterval);
      remainingSec = s;
      timerEnd = Date.now() + remainingSec * 1000;
      document.getElementById('timer-status').innerText = `Pause läuft (${s}s)`;
      timerInterval = setInterval(() => {
        const diff = Math.round((timerEnd - Date.now()) / 1000);
        if (diff <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          remainingSec = 0;
          document.getElementById('timer-status').innerText = '🔥 Nächster Satz!';
        } else { remainingSec = diff; }
        updateTimerUI();
      }, 250);
      updateTimerUI();
    }
    function toggleTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; document.getElementById('timer-status').innerText = 'Timer pausiert'; }
      else startTimer(remainingSec > 0 ? remainingSec : 90);
      updateTimerUI();
    }
    function adjustTimer(d) { remainingSec = Math.max(0, remainingSec + d); if (timerInterval) timerEnd = Date.now() + remainingSec * 1000; updateTimerUI(); }
    function resetTimer(s = 90) { clearInterval(timerInterval); timerInterval = null; remainingSec = s; document.getElementById('timer-status').innerText = 'Pausentimer bereit'; updateTimerUI(); }

    render();
    updateTimerUI();
  </script>
</body>
</html>
